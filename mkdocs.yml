site_name: hetzner-kube-express
site_description: An opinionated, startup-ready Kubernetes platform on Hetzner Cloud.
site_url: https://paapug.github.io/hetzner-kube-express/
repo_url: https://github.com/paapug/hetzner-kube-express
repo_name: paapug/hetzner-kube-express
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Getting started: index.md
  - Joining as a teammate: joining.md
