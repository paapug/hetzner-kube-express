site_name: hetzner-kube-express
site_description: An opinionated, startup-ready Kubernetes platform on Hetzner Cloud.
site_url: https://paapug.github.io/hetzner-kube-express/
repo_url: https://github.com/paapug/hetzner-kube-express
repo_name: paapug/hetzner-kube-express
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start here: 
    - Welcome: index.md
    - Getting started: getting-started.md
    - Joining as a teammate: joining.md
    - Contributing: contributing.md
  - User guide:
      - How it fits together: how-it-fits-together.md
      - Secrets and helper scripts: secrets-and-scripts.md
      - Adding environments: adding-environments.md
      - Ingress: ingress.md
      - Persistent Volumes: persistent-volumes.md
      - SigNoz: signoz.md


